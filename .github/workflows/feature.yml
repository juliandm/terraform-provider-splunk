name: Build Terraform Provider (manual + tags, linux + mac)

on:
  workflow_dispatch: {}   # manual trigger from the UI
  push:
    tags:
      - 'v*'              # runs when you push tags like v0.0.1, v1.2.3, ...

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false      # avoid tar/cache warnings

      # --- Build binaries ---

      - name: Build linux_amd64
        env:
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -o terraform-provider-signalfx-linux-amd64 .

      - name: Build darwin_arm64
        env:
          GOOS: darwin
          GOARCH: arm64
        run: |
          go build -o terraform-provider-signalfx-darwin-arm64 .

      # --- Upload as artifact (for manual runs, debugging, etc.) ---

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: terraform-provider-signalfx-binaries
          path: |
            terraform-provider-signalfx-linux-amd64
            terraform-provider-signalfx-darwin-arm64

      # --- Attach binaries to the tag's GitHub Release (only for tag pushes) ---

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            terraform-provider-signalfx-linux-amd64
            terraform-provider-signalfx-darwin-arm64
