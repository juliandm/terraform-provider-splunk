name: Build Terraform Provider

on:
  workflow_dispatch: {}          # allow manual runs from UI
  push:
    tags:
      - 'v*'
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"     # or whatever the provider uses

      - name: Build linux_amd64 binary
        env:
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -o terraform-provider-signalfx .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-provider-signalfx-linux-amd64
          path: terraform-provider-signalfx

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: terraform-provider-signalfx