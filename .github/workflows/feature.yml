name: Build Terraform Provider (manual only, linux + mac)

on:
  workflow_dispatch: {}   # only manual trigger
  push:
    tags:
      - 'v*'
jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: Build provider for ${{ matrix.goos }}_${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -o terraform-provider-signalfx-${GOOS}-${GOARCH} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-provider-signalfx-${{ matrix.goos }}-${{ matrix.goarch }}
          path: terraform-provider-signalfx-${{ matrix.goos }}-${{ matrix.goarch }}
